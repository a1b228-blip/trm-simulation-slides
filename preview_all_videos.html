<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>TRM 黃金三部曲 40秒精華教學影片全系列試聽</title>
  <style>
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', 'Noto Sans TC', sans-serif;
      margin: 0;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      color: #4fc3f7;
      margin-bottom: 8px;
    }
    p.subtitle {
      color: #8b949e;
      margin-bottom: 25px;
      font-size: 1.05em;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 1400px;
    }
    .card {
      background: #161b22;
      border-radius: 18px;
      padding: 20px;
      border: 2px solid rgba(255,255,255,0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card-brief { border-color: #4fc3f7; }
    .card-huddle { border-color: #ffb74d; }
    .card-debrief { border-color: #81c784; }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.85em;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .badge-brief { background: rgba(79, 195, 247, 0.2); color: #4fc3f7; }
    .badge-huddle { background: rgba(255, 183, 77, 0.2); color: #ffb74d; }
    .badge-debrief { background: rgba(129, 199, 132, 0.2); color: #81c784; }
    h2 {
      margin: 6px 0 14px 0;
      font-size: 1.25em;
      color: #fff;
    }
    video {
      width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      background: #000;
    }
  </style>
</head>
<body>

  <h1>🎬 TRM 領導黃金三部曲 40秒精華教學影片（全新舒緩語速與高清晰大字版）</h1>
  <p class="subtitle">語速放緩 10%～15% · 1080p 超大字高對比極致排版 · 適合全場觀眾舒適觀看</p>

  <div class="grid">
    
    <!-- Brief -->
    <div class="card card-brief">
      <span class="badge badge-brief">Step 1: 40秒精華</span>
      <h2>🎯 Brief (事前說明)</h2>
      <video controls playsinline poster="videos/poster4.jpg">
        <source src="videos/media4_brief.mp4" type="video/mp4">
      </video>
    </div>

    <!-- Huddle -->
    <div class="card card-huddle">
      <span class="badge badge-huddle">Step 2: 40秒精華</span>
      <h2>💬 Huddle (過程中討論)</h2>
      <video controls playsinline poster="videos/poster5.jpg">
        <source src="videos/media5_huddle.mp4" type="video/mp4">
      </video>
    </div>

    <!-- Debrief -->
    <div class="card card-debrief">
      <span class="badge badge-debrief">Step 3: 40秒精華</span>
      <h2>📊 Debrief (事後檢視)</h2>
      <video controls playsinline poster="videos/poster6.jpg">
        <source src="videos/media6_debrief.mp4" type="video/mp4">
      </video>
    </div>

  </div>

</body>
</html>
