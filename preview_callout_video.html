<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>放射診斷科 Call-Out 卡通影片方案一 vs 方案二對比預覽</title>
  <style>
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', 'Noto Sans TC', sans-serif;
      margin: 0;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      color: #ffd700;
      margin-bottom: 8px;
    }
    p.subtitle {
      color: #a3b8cc;
      margin-bottom: 30px;
      font-size: 1.05em;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
      gap: 30px;
      width: 100%;
      max-width: 1440px;
    }
    .card {
      background: #161b22;
      border-radius: 20px;
      padding: 24px;
      border: 3px solid rgba(255, 215, 0, 0.4);
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .card-v1 { border-color: #79c0ff; }
    .card-v2 { border-color: #ffd700; }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 0.9em;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .badge-v1 { background: rgba(121, 192, 255, 0.2); color: #79c0ff; }
    .badge-v2 { background: rgba(255, 215, 0, 0.2); color: #ffd700; }
    h2 {
      margin: 6px 0 14px 0;
      font-size: 1.3em;
      color: #fff;
    }
    video {
      width: 100%;
      max-height: 480px;
      border-radius: 14px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: #000;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>🎨 放射診斷科 Call-Out (大聲通報) 卡通影片：方案一 vs 方案二對比</h1>
  <p class="subtitle">包含台灣繁體中文沉穩導讀 + 40 秒完整內容（請對比 2D 向量 Q 版與 3D Pixar AI 繪圖）</p>

  <div class="grid">
    
    <!-- 方案一 -->
    <div class="card card-v1">
      <span class="badge badge-v1">方案一：2D Q 版向量卡通動畫</span>
      <h2>🤖 方案一：2D Q 版卡通人偶 + 爆發對話框 + 音波</h2>
      <p style="font-size:0.85em; color:#a3b8cc;">繪製 Q 版卡通放射師人偶、爆發對話框與隔空金黃聲波傳遞</p>
      <video controls playsinline poster="videos/poster7.jpg">
        <source src="videos/media7_callout_cartoon.mp4" type="video/mp4">
      </video>
    </div>

    <!-- 方案二 -->
    <div class="card card-v2">
      <span class="badge badge-v2">方案二：3D Pixar AI 繪圖動畫</span>
      <h2>✨ 方案二：3D Pixar 電影級 AI 繪圖視覺</h2>
      <p style="font-size:0.85em; color:#ffd700;">使用 AI 繪圖生成皮克斯電影級 3D 放射科場景與浮空全息心智地圖</p>
      <video controls playsinline poster="videos/poster7_pixar.jpg">
        <source src="videos/media7_callout_pixar.mp4" type="video/mp4">
      </video>
    </div>

  </div>

</body>
</html>
